min_version = "2026.11.3"

[env]
# Local development defaults; credentials are supplied by the host.
APP_ENV = "local"
PORT = "8080"
LINE_EVENT_MODE = "sync"
LINE_API_TIMEOUT = "8s"
LOG_LEVEL = "info"
LOG_FORMAT = "text"
TELEMETRY_MODE = "off"
OTEL_TRACE_SAMPLE_RATIO = "0.05"
OTEL_METRIC_INTERVAL = "60s"
FIRESTORE_DATABASE = "(default)"
GOCACHE = "{{ env.GOCACHE | default(value='/workspace/.cache/go-build') }}"
GOPATH = "{{ env.GOPATH | default(value='/workspace/.cache/go') }}"
XDG_CACHE_HOME = "{{ env.XDG_CACHE_HOME | default(value='/workspace/.cache') }}"
GOFLAGS = "-mod=readonly"
GOTOOLCHAIN = "local"

[tools]
# Tool versions are owned here; scripts consume this configuration.
go = "1.27.3"
node = "24.22.1"
"go:golang.org/x/tools/gopls" = "0.24.0"
"npm:repomix" = "1.18.1"

# Optional integrations are installed explicitly, not required for core MCPs.
[tasks.install-integrations]
run = "mise install gcloud@592.0.0 npm:@line/line-bot-mcp-server@0.5.0 npm:@ivotoby/openapi-mcp-server@1.16.1 npm:@toolbox-sdk/server@1.14.0"
[tasks.install-integrations.env]
CLOUDSDK_CONFIG = "/workspace/.cache/gcloud-install"

[settings]
exec_auto_install = false


[tasks.setup]
run = ["go mod download", "go mod verify"]

[tasks.check]
run = "make check"

[tasks.dev]
run = "make dev"

[tasks.mcp-check]
run = ["go run ./cmd/codexcheck", "mise run mcp-smoke"]

[tasks.mcp-smoke]
description = "Exercise configured local MCP commands; requires Python 3.11+"
run = "python3 scripts/codex-cloud/mcp_smoke.py"

[tasks.plugins-install]
description = "Install Agent Skills and register the Google plugin marketplace"
run = [
  "codex plugin marketplace add addyosmani/agent-skills",
  "codex plugin add agent-skills@agent-skills",
  "codex plugin marketplace add google/skills",
]
