# Staging-only public LINE webhook. Replace app with your globally unique Fly app name.
# Do not place credentials or Google service-account JSON in this file.
app = "linebot-webhook-staging"
primary_region = "nrt"
kill_signal = "SIGTERM"
kill_timeout = 20

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "staging"
  PORT = "8080"
  LINE_EVENT_MODE = "durable"
  LOG_LEVEL = "info"
  LOG_FORMAT = "json"
  GOOGLE_APPLICATION_CREDENTIALS = "/gcp-credentials.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"

# Staging bootstrap: only use a restricted, rotatable Google SA key in this
# base64-encoded Fly secret. Replace with a verified keyless ADC/WIF setup
# before production; Fly does not automatically provide Cloud Run ADC.
[[files]]
  guest_path = "/gcp-credentials.json"
  secret_name = "GCP_ADC_JSON_B64"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
