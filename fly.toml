# fly.toml app configuration file generated for linebot-platform on 2026-11-03T12:35:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'linebot-platform'
primary_region = 'sin'
kill_signal = 'SIGTERM'
kill_timeout = '20s'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'staging'
  GOOGLE_APPLICATION_CREDENTIALS = '/gcp-credentials.json'
  LINE_EVENT_MODE = 'durable'
  LOG_FORMAT = 'json'
  LOG_LEVEL = 'info'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

[[files]]
  guest_path = '/gcp-credentials.json'
  secret_name = 'GCP_ADC_JSON_B64'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
