openapi: 3.1.0
info:
  title: linebot-platform bootstrap webhook
  version: 0.1.0
  description: Durable-only LINE ingress with signature and destination verification, Firestore inbox/outbox and asynchronous delivery.
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Healthy process
  /webhook/line:
    post:
      summary: Verified durable LINE webhook
      description: Requires X-Line-Signature and matching Bot destination. Direct/group text events are persisted and queued; unsupported Room events are acknowledged without writes.
      parameters:
        - name: X-Line-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Accepted events durably recorded and queued, or unsupported/stale events safely ignored
        '400':
          description: Invalid webhook payload
        '401':
          description: Invalid signature or Bot destination mismatch
        '413':
          description: Body exceeds 1 MiB
        '503':
          description: Webhook not configured or persistence/queue temporarily unavailable; redelivery preserves event deduplication
