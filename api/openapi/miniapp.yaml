openapi: 3.1.0
info:
  title: linebot-platform LINE MINI App Infrastructure API
  version: 1.0.0
  description: LINE MINI App assets and server-verified LIFF session infrastructure. No business data is written.
paths:
  /miniapp/:
    get:
      tags: [Mini App]
      responses:
        '200': {description: LINE MINI App HTML}
  /miniapp/config.json:
    get:
      tags: [Mini App]
      responses:
        '200':
          description: Public LIFF configuration
          content:
            application/json:
              schema:
                type: object
                required: [liffId]
                properties: {liffId: {type: string}}
  /miniapp/api/v1/session:
    get:
      tags: [Mini App]
      security: [{lineIDToken: []}]
      responses:
        '200':
          description: Server-verified LINE session
          content:
            application/json:
              schema:
                type: object
                required: [authenticated, validatedAt]
                properties:
                  authenticated: {type: boolean, const: true}
                  validatedAt: {type: string, format: date-time}
        '401': {description: Invalid or missing LINE ID token}
        '403': {description: Disallowed browser origin}
        '405': {description: Method not allowed}
        '503': {description: LINE identity verification unavailable}
components:
  securitySchemes:
    lineIDToken:
      type: http
      scheme: bearer
      bearerFormat: LINE ID token
