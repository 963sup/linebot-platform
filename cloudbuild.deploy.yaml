# Manual production deployment for the Line Bot Cloud Run services.
# It creates or updates services from immutable images and removes legacy
# environment variables from both services.
substitutions:
  _APPROVE_DEPLOYMENT: 'false'
  _REGION: 'asia-east1'
  _PUBLIC_SERVICE: 'line-bot-public'
  _PRIVATE_SERVICE: 'line-bot-private'
  _MINIAPP_SERVICE: 'line-miniapp'
  _PUBLIC_IMAGE_URI: 'asia-east1-docker.pkg.dev/bubbly-area-513305-s0/line-bot/line-bot-public@sha256:0a3bb6f72e15a06a6ab30609cc5b8397e4f4c627ecf04381a544945671d426de'
  _PRIVATE_IMAGE_URI: 'asia-east1-docker.pkg.dev/bubbly-area-513305-s0/line-bot/line-bot-private@sha256:305ad54880e7ab43f37b9c4c79de193296ace2e5b5c880cec9857768c04b6331'
  _MINIAPP_IMAGE_URI: 'asia-east1-docker.pkg.dev/bubbly-area-513305-s0/line-bot/line-miniapp@sha256:74527b25751f4922a516164e1aab2b416dc057547643b69d6ddac2238ce155b0'
  _QUEUE_ID: 'line-bot-events'
  _LINE_MESSAGING_API_BOT_USER_ID: 'Ud0b6801817535b771ba47af2f15b42e8'
  _TASK_INVOKER_EMAIL: 'line-bot-invoker@bubbly-area-513305-s0.iam.gserviceaccount.com'
  _TASK_WORKER_ORIGIN: 'https://line-bot-private-jtghegqd7q-de.a.run.app'
  _DEPLOYER_SERVICE_ACCOUNT: 'line-bot-deployer@bubbly-area-513305-s0.iam.gserviceaccount.com'
  _PUBLIC_SERVICE_ACCOUNT: 'line-bot-public@bubbly-area-513305-s0.iam.gserviceaccount.com'
  _WORKER_SERVICE_ACCOUNT: 'line-bot-worker@bubbly-area-513305-s0.iam.gserviceaccount.com'
  _MINIAPP_SERVICE_ACCOUNT: 'line-miniapp@bubbly-area-513305-s0.iam.gserviceaccount.com'
  _LINE_MINI_APP_CHANNEL_ID: '2012412009'
  _LINE_MINI_APP_LIFF_URL: 'https://miniapp.line.me/2012412009-Xp2CQWOP'
  _LINE_MINI_APP_ENDPOINT_URL: 'https://line-miniapp-185354881750.asia-east1.run.app/miniapp/'
  _STAGING_EVIDENCE_URI: ''
  _STAGING_EVIDENCE_SHA256: ''

serviceAccount: 'projects/bubbly-area-513305-s0/serviceAccounts/${_DEPLOYER_SERVICE_ACCOUNT}'

steps:
  - id: 'preflight-production'
    name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:18d8c484aaef27d7ef7b54dfb018f73712503d254a16f0a76b2626b4f6003af2'
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        if [ '${_APPROVE_DEPLOYMENT}' != 'true' ]; then
          echo 'Deployment disabled. Require explicit _APPROVE_DEPLOYMENT=true.' >&2
          exit 2
        fi
        if [ '$PROJECT_ID' != 'bubbly-area-513305-s0' ]; then
          echo 'This deployment configuration only targets bubbly-area-513305-s0.' >&2
          exit 2
        fi
        if ! printf '%s' '${_LINE_MESSAGING_API_BOT_USER_ID}' | grep -Eq '^U[0-9a-f]{32}$'; then
          echo 'Specify _LINE_MESSAGING_API_BOT_USER_ID as a LINE user ID.' >&2
          exit 2
        fi
        case '${_STAGING_EVIDENCE_URI}' in gs://*) ;; *) echo 'Specify an immutable gs:// staging evidence object.' >&2; exit 2;; esac
        gcloud storage cp '${_STAGING_EVIDENCE_URI}' /workspace/staging-evidence.json >/dev/null
        PROJECT_ID='$PROJECT_ID' REGION='${_REGION}' QUEUE_ID='${_QUEUE_ID}' \
          PUBLIC_IMAGE_URI='${_PUBLIC_IMAGE_URI}' PRIVATE_IMAGE_URI='${_PRIVATE_IMAGE_URI}' MINIAPP_IMAGE_URI='${_MINIAPP_IMAGE_URI}' \
          PUBLIC_SERVICE_ACCOUNT='${_PUBLIC_SERVICE_ACCOUNT}' WORKER_SERVICE_ACCOUNT='${_WORKER_SERVICE_ACCOUNT}' MINIAPP_SERVICE_ACCOUNT='${_MINIAPP_SERVICE_ACCOUNT}' \
          INVOKER_SERVICE_ACCOUNT='${_TASK_INVOKER_EMAIL}' WORKER_SERVICE='${_PRIVATE_SERVICE}' \
          TASK_WORKER_ORIGIN='${_TASK_WORKER_ORIGIN}' LINE_MINI_APP_ENDPOINT_URL='${_LINE_MINI_APP_ENDPOINT_URL}' \
          LINE_MINI_APP_CHANNEL_ID='${_LINE_MINI_APP_CHANNEL_ID}' LINE_MINI_APP_LIFF_URL='${_LINE_MINI_APP_LIFF_URL}' \
          STAGING_EVIDENCE_FILE=/workspace/staging-evidence.json \
          STAGING_EVIDENCE_SHA256='${_STAGING_EVIDENCE_SHA256}' bash deploy/scripts/preflight.sh

  - id: 'deploy-public-webhook'
    name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:18d8c484aaef27d7ef7b54dfb018f73712503d254a16f0a76b2626b4f6003af2'
    waitFor: ['preflight-production']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_PUBLIC_SERVICE}'
      - '--image=${_PUBLIC_IMAGE_URI}'
      - '--region=${_REGION}'
      - '--project=$PROJECT_ID'
      - '--service-account=${_PUBLIC_SERVICE_ACCOUNT}'
      - '--no-invoker-iam-check'
      - '--ingress=all'
      - '--no-traffic'
      - '--deploy-health-check'
      - '--tag=candidate'
      - '--set-env-vars=APP_ENV=production,LINE_EVENT_MODE=durable,LINE_MINI_APP_LIFF_URL=${_LINE_MINI_APP_LIFF_URL},LINE_MESSAGING_API_BOT_USER_ID=${_LINE_MESSAGING_API_BOT_USER_ID},GCP_PROJECT_ID=$PROJECT_ID,TASK_QUEUE_NAME=projects/$PROJECT_ID/locations/${_REGION}/queues/${_QUEUE_ID},TASK_WORKER_URL=${_TASK_WORKER_ORIGIN}/tasks/v2/line-reply,TASK_OIDC_AUDIENCE=${_TASK_WORKER_ORIGIN},TASK_INVOKER_EMAIL=${_TASK_INVOKER_EMAIL}'
      - '--set-secrets=LINE_MESSAGING_API_CHANNEL_SECRET=line-messaging-api-channel-secret:latest'
      - '--quiet'
      - '--format=value(status.latestCreatedRevisionName)'

  - id: 'deploy-private-worker'
    name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:18d8c484aaef27d7ef7b54dfb018f73712503d254a16f0a76b2626b4f6003af2'
    waitFor: ['preflight-production']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_PRIVATE_SERVICE}'
      - '--image=${_PRIVATE_IMAGE_URI}'
      - '--region=${_REGION}'
      - '--project=$PROJECT_ID'
      - '--service-account=${_WORKER_SERVICE_ACCOUNT}'
      - '--no-allow-unauthenticated'
      - '--ingress=internal'
      - '--concurrency=16'
      - '--no-traffic'
      - '--deploy-health-check'
      - '--tag=candidate'
      - '--set-env-vars=APP_ENV=production,GCP_PROJECT_ID=$PROJECT_ID,TASK_QUEUE_NAME=projects/$PROJECT_ID/locations/${_REGION}/queues/${_QUEUE_ID},TASK_WORKER_URL=${_TASK_WORKER_ORIGIN}/tasks/v2/line-reply,TASK_OIDC_AUDIENCE=${_TASK_WORKER_ORIGIN},TASK_INVOKER_EMAIL=${_TASK_INVOKER_EMAIL}'
      - '--set-secrets=LINE_MESSAGING_API_CHANNEL_ACCESS_TOKEN=line-messaging-api-channel-access-token:latest'
      - '--quiet'
      - '--format=value(status.latestCreatedRevisionName)'

  - id: 'deploy-miniapp'
    name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:18d8c484aaef27d7ef7b54dfb018f73712503d254a16f0a76b2626b4f6003af2'
    waitFor: ['preflight-production']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_MINIAPP_SERVICE}'
      - '--image=${_MINIAPP_IMAGE_URI}'
      - '--region=${_REGION}'
      - '--project=$PROJECT_ID'
      - '--service-account=${_MINIAPP_SERVICE_ACCOUNT}'
      - '--allow-unauthenticated'
      - '--ingress=all'
      - '--no-traffic'
      - '--deploy-health-check'
      - '--tag=candidate'
      - '--set-env-vars=APP_ENV=production,LINE_MINI_APP_CHANNEL_ID=${_LINE_MINI_APP_CHANNEL_ID},LINE_MINI_APP_LIFF_URL=${_LINE_MINI_APP_LIFF_URL},LINE_MINI_APP_ENDPOINT_URL=${_LINE_MINI_APP_ENDPOINT_URL}'
      - '--clear-secrets'
      - '--quiet'
      - '--format=value(status.latestCreatedRevisionName)'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '900s'
