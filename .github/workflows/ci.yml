name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          # Restore Go module downloads and compiled packages on repeat PR runs.
          # Keep versions pinned in go.mod/go.sum; do not skip race/vet/build.
          cache: true
          cache-dependency-path: go.sum
      - name: Resolve approved Go SDK dependencies
        run: |
          go mod tidy
          go mod download
      - name: Verify dependency lockfiles are committed
        run: git diff --exit-code -- go.mod go.sum
      - name: Validate Codex settings and SDK catalog (Go)
        run: go run ./cmd/codexcheck
      - name: Format, vet, race tests and build
        run: make check
      - name: Preserve resolved go.mod and go.sum for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolved-go-dependencies
          path: |
            go.mod
            go.sum
          if-no-files-found: warn
          retention-days: 7


  firestore-emulator:
    name: Firestore Emulator transactions and concurrent recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8086
      GOOGLE_CLOUD_PROJECT: linebot-emulator-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go.sum
      # Official action at reviewed, immutable v3 commit. Emulator requires no ADC.
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          install_components: 'cloud-firestore-emulator'
      - name: Start isolated Firestore Emulator
        shell: bash
        run: |
          set -euo pipefail
          gcloud emulators firestore start --host-port=127.0.0.1:8086 --quiet >"$RUNNER_TEMP/firestore-emulator.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/8086) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/firestore-emulator.log" >&2
          exit 1
      - name: Verify Firestore transactions, concurrent Claim and recovery fairness
        run: go test -race -count=1 -timeout=12m -tags=integration ./tests/integration/...
      - name: Emulator diagnostics on failure
        if: failure()
        shell: bash
        run: tail -n 120 "$RUNNER_TEMP/firestore-emulator.log" || true
