name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Resolve approved Go SDK dependencies
        run: |
          go mod tidy
          go mod download
      - name: Verify dependency lockfiles are committed
        run: git diff --exit-code -- go.mod go.sum
      - name: Validate Codex settings and SDK scenarios (Go)
        run: go run ./cmd/codexcheck
      - name: Format, vet, race tests and build
        run: make check
      - name: Compile Firestore Emulator suite without external calls
        run: go test -tags=integration -run='^$' ./tests/integration
      - name: Check Stage-5 runner and fail-closed evidence example
        run: |
          bash -n scripts/run-stage5-offline.sh
          if go run ./cmd/acceptance -evidence docs/acceptance/staging-evidence.example.json; then
            echo "Stage-5 example must not pass without real review evidence" >&2
            exit 1
          fi
      - name: Preserve resolved go.mod and go.sum for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolved-go-dependencies
          path: |
            go.mod
            go.sum
          if-no-files-found: warn
          retention-days: 7

  firestore-emulator:
    name: Firestore Emulator transactions (no GCP credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Start isolated official Firestore Emulator
        run: |
          docker run --rm --detach --name firestore-emulator \
            --publish 127.0.0.1:8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:112c21f8f6e04b03b393b3c34fb943a1f443e839f18c6492c364ac2e6c3ff935 \
            gcloud emulators firestore start --host-port=0.0.0.0:8085
          for attempt in $(seq 1 90); do
            if (echo > /dev/tcp/127.0.0.1/8085) >/dev/null 2>&1; then
              exit 0
            fi
            if ! docker inspect --format='{{.State.Running}}' firestore-emulator 2>/dev/null | grep -qx true; then
              docker logs firestore-emulator || true
              echo "Local Firestore emulator exited unexpectedly" >&2
              exit 1
            fi
            sleep 2
          done
          docker logs firestore-emulator || true
          echo "Local Firestore emulator failed to listen on 127.0.0.1:8085" >&2
          exit 1
      - name: Run real Firestore SDK integration tests against local emulator
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          GOOGLE_CLOUD_PROJECT: demo-linebot-platform-acceptance
        run: |
          env -u GOOGLE_APPLICATION_CREDENTIALS \
            go test -tags=integration -race -count=1 -timeout=4m -v ./tests/integration
      - name: Stop and inspect local emulator
        if: always()
        run: |
          docker logs --tail 80 firestore-emulator 2>/dev/null || true
          docker rm --force firestore-emulator 2>/dev/null || true
