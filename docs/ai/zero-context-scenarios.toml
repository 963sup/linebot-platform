# Reproducible fresh-session Codex task definitions. This file is an
# acceptance input, not proof that an agent has executed the tasks.
schema_version = 1

[[scenarios]]
id = "line-rich-menu"
prompt = "在 LINE Bot 增加 Rich Menu 功能，遵守現有架構並建立可靠的離線測試。"
module = "github.com/line/line-bot-sdk-go/v8"
reference = "internal/infrastructure/line/client_factory.go"
checks = ["查證 go.mod 的 LINE SDK 版本及實際方法", "從 Adapter 呼叫原生 SDK 而非新增萬用 Call", "提供方法契約與錯誤測試"]

[[scenarios]]
id = "google-tasks"
prompt = "增加使用者待辦清單的查詢能力，不能存取未授權的帳號資料。"
module = "google.golang.org/api"
reference = "internal/infrastructure/google/api/client_factory.go"
checks = ["選用 Google Tasks 而不是 Sheets 或 Cloud Tasks", "確認使用者 OAuth Scope 與隔離方式", "提供模擬 HTTP 測試而不要求真實憑證"]

[[scenarios]]
id = "google-calendar"
prompt = "讓 Bot 可以查詢使用者行事曆中即將到來的事件。"
module = "google.golang.org/api"
reference = "docs/sdk/workspace-oauth.md"
checks = ["選擇 Calendar Events API", "解釋最小 OAuth 授權與 token 儲存限制", "提供未授權時安全拒絕與離線測試"]

[[scenarios]]
id = "ai-reply"
prompt = "讓 Bot 可以由可替換的 AI 提供者產生回答，且不直接將 SDK 型別帶進業務層。"
module = "github.com/openai/openai-go/v3"
reference = "internal/infrastructure/openai/client_factory.go"
checks = ["查證官方 SDK 版本與型別", "用 Port 隔離業務與 SDK", "避免日誌洩漏使用者原文及 API key"]

[[scenarios]]
id = "durable-redelivery"
prompt = "Webhook 可能重送，請確保背景工作不會重複發送 LINE 訊息。"
module = "cloud.google.com/go/cloudtasks"
reference = "internal/application/usecases/ingestion/service.go"
checks = ["以事件鍵去重、使用持久化單次 Claim", "釐清遠端失敗結果未知與重試限制", "用離線契約測試展示重送及未知終態"]

[[scenarios]]
id = "sdk-upgrade"
prompt = "需要升級 Gemini 官方 SDK；請先查證相容性並更新必須同步的檔案。"
module = "google.golang.org/genai"
reference = ".agents/skills/sdk-integration/SKILL.md"
checks = ["以 go.mod 而不是模型記憶決定版本", "查證方法簽名與變更記錄", "同步 Catalog、文件與測試且不未授權呼叫 API"]
