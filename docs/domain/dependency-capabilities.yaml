    assumption: Carries technical telemetry without owning application or Domain decisions.
  - module: go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc
    version: v1.47.0
    catalog_status: integrated
    classification: generic-infrastructure
    capabilities: [otlp-metric-export]
    contexts: []
    evidence: [internal/infrastructure/observability/runtime.go]
    assumption: Exports bounded metrics to the fixed loopback collector and is disabled by default.
  - module: go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc
    version: v1.47.0
    catalog_status: integrated
    classification: generic-infrastructure
    capabilities: [otlp-trace-export]
    contexts: []
    evidence: [internal/infrastructure/observability/runtime.go]
    assumption: Exports traces to the fixed loopback collector and is disabled by default.
  - module: go.opentelemetry.io/otel/metric
    version: v1.47.0
    catalog_status: integrated
    classification: generic-infrastructure
    capabilities: [metric-instrumentation]
    contexts: []
    evidence: [internal/infrastructure/observability]
    assumption: Records low-cardinality technical signals and no business metrics.
  - module: go.opentelemetry.io/otel/sdk
    version: v1.47.0
    catalog_status: integrated
    classification: generic-infrastructure
    capabilities: [trace-provider, sampling]
    contexts: []
    evidence: [internal/infrastructure/observability/runtime.go]
    assumption: Owns trace provider lifecycle inside infrastructure only.
  - module: go.opentelemetry.io/otel/sdk/metric
    version: v1.47.0
    catalog_status: integrated
    classification: generic-infrastructure
    capabilities: [meter-provider, periodic-metric-reader]
    contexts: []
    evidence: [internal/infrastructure/observability/runtime.go]
    assumption: Owns metric provider lifecycle inside infrastructure only.
  - module: go.opentelemetry.io/otel/trace
    version: v1.47.0
    catalog_status: integrated
    classification: generic-infrastructure
    capabilities: [span-instrumentation]
