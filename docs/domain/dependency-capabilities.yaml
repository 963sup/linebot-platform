schema_version: 1
source_go_mod: go.mod
source_sdk_catalog: docs/sdk/catalog.toml
modules:
  - module: cloud.google.com/go/cloudtasks
    version: v1.21.1
    catalog_status: integrated
    classification: generic-infrastructure
    capabilities: [durable-background-work, oidc-worker, bounded-task-deduplication]
    contexts: []
    evidence: [internal/adapter/outbound/google/cloud/cloudtasks/queue.go]
    assumption: Schedules delivery work but does not own delivery state or business idempotency.
  - module: cloud.google.com/go/firestore
    version: v1.29.2
    catalog_status: integrated
    classification: generic-infrastructure
    capabilities: [transactions, durable-inbox-outbox, persistence]
    contexts: []
    evidence: [internal/adapter/outbound/google/cloud/firestore/event_store.go]
    assumption: Persists context-owned data but is not a Domain owner.
  - module: cloud.google.com/go/secretmanager
    version: v1.23.1
    catalog_status: client_ready
    classification: generic-infrastructure
    capabilities: [secret-access]
    contexts: []
    evidence: [internal/infrastructure/google/cloud/secretmanager]
    assumption: Provides credential storage without owning authorization semantics.
  - module: github.com/BurntSushi/toml
    version: v1.6.0
    catalog_status: integrated
    classification: tooling
    capabilities: [toml-parse, configuration-validation]
    contexts: []
    evidence: [cmd/codexcheck]
    assumption: Supports governance tooling and provides no business capability.
  - module: github.com/google/uuid
    version: v1.6.0
    catalog_status: integrated
    classification: generic-infrastructure
    capabilities: [uuid-v4, retry-key-generation]
    contexts: []
    evidence: [internal/application]
    assumption: Generates technical identifiers whose business meaning remains consumer-owned.
  - module: github.com/line/line-bot-sdk-go/v8
    version: v8.23.0
    catalog_status: integrated
    classification: domain-signal
    capabilities: [webhook, messaging, audiences, presentation, promotion, membership, analytics]
    contexts: [messaging-delivery, audience, experience-presentation, promotion, membership, contact-directory, insights-reporting]
    evidence: [internal/adapter/outbound/line]
    assumption: Provider operation groups suggest capabilities but never define bounded contexts or aggregates.
  - module: github.com/modelcontextprotocol/go-sdk
    version: v1.8.0
    catalog_status: client_ready
    classification: generic-infrastructure
    capabilities: [tool-discovery, tool-invocation]
    contexts: []
    evidence: [internal/infrastructure/mcp]
    assumption: MCP is an integration mechanism and not a business context.
  - module: github.com/openai/openai-go/v3
    version: v3.91.1
    catalog_status: client_ready
    classification: supporting-capability
    capabilities: [ai-text-generation, responses-api]
    contexts: [content-intelligence]
    evidence: [internal/infrastructure/openai]
    assumption: May implement Content Intelligence ports but does not prove product-owned generation policy.
  - module: go.opentelemetry.io/contrib/detectors/gcp
    version: v1.45.0
    catalog_status: integrated
    classification: generic-infrastructure
    capabilities: [gcp-resource-detection]
