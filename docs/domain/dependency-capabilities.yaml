  - module: go.yaml.in/yaml/v3
    version: v3.0.5
    catalog_status: integrated
    classification: tooling
    capabilities: [strict-yaml-validation, governance-manifests]
    contexts: []
    evidence: [internal/governance/domainmodel]
    assumption: Supports governance tooling and provides no business capability.
  - module: google.golang.org/api
    version: v0.310.0
    catalog_status: integrated
    classification: generic-infrastructure
    capabilities: [google-idtoken-verification, google-api-client-options]
