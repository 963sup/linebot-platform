    assumption: Detects bounded deployment resource metadata and provides no business capability.
  - module: go.opentelemetry.io/otel
    version: v1.47.0
    catalog_status: integrated
    classification: generic-infrastructure
    capabilities: [trace-context, telemetry-api]
