  - module: google.golang.org/genai
    version: v1.77.0
    catalog_status: client_ready
    classification: supporting-capability
    capabilities: [gemini, vertex-ai, ai-text-generation]
    contexts: [content-intelligence]
    evidence: [internal/infrastructure/google/genai]
    assumption: Alternative implementation of Content Intelligence ports rather than a separate context.
  - module: google.golang.org/grpc
    version: v1.84.0
    catalog_status: integrated
    classification: generic-infrastructure
    capabilities: [cloud-api-status, error-translation]
    contexts: []
