  - id: membership
    subdomain: customer-experience
    status: candidate
    decision_status: hypothesis
    confidence: low
    model_kind: read-model
    classification: supporting
    owner: unassigned
    purpose: Present membership and entitlement facts without claiming provider lifecycle ownership.
    non_responsibilities: [Mutate provider membership., Own promotion lifecycle., Invent an aggregate without local commands.]
    language:
      - {term: membership-status, definition: "Observed membership state at a point in time.", forbidden_aliases: [membership-aggregate], code_symbols: []}
      - {term: entitlement-view, definition: "Derived benefits visible to a consumer.", forbidden_aliases: [permission], code_symbols: []}
    owns: [membership-projection]
    data_ownership:
      - {resource: membership-source-state, authority: provider-authoritative, owner: line-provider, write_policy: "Read-only through an ACL.", evidence: [internal/adapter/outbound/line]}
      - {resource: membership-projection, authority: derived-projection, owner: membership, write_policy: "Rebuilt from provider facts.", evidence: [internal/application/usecases/membership/membership.go]}
    invariants: [{id: MEM-001, statement: "A projection cannot grant an entitlement absent from source facts.", evidence: [internal/application/usecases/membership/membership_test.go]}]
    capabilities: [inspect-membership, derive-entitlement-view]
    open_questions: [Promote only after local enrollment or entitlement commands exist.]
    evidence: [internal/application/usecases/membership/membership_test.go]

  - id: contact-directory
    subdomain: customer-knowledge
    status: candidate
    decision_status: hypothesis
    confidence: medium
    model_kind: read-model
    classification: supporting
    owner: unassigned
    purpose: Resolve stable recipient references and present provider profile snapshots.
    non_responsibilities: [Own provider profiles., Decide audience membership., Deliver messages.]
    language:
      - {term: recipient-reference, definition: "Stable reference usable by delivery.", forbidden_aliases: [line-user-object], code_symbols: []}
      - {term: profile-snapshot, definition: "Time-stamped observation of provider profile data.", forbidden_aliases: [customer-aggregate], code_symbols: []}
    owns: [recipient-index, profile-projection]
    data_ownership:
      - {resource: provider-profile, authority: provider-authoritative, owner: line-provider, write_policy: "Read-only through an ACL.", evidence: [internal/adapter/outbound/line]}
      - {resource: profile-projection, authority: derived-projection, owner: contact-directory, write_policy: "Rebuilt from observations.", evidence: [internal/application/usecases/contact-directory/contacts.go]}
    invariants: [{id: CON-001, statement: "A snapshot records observation time and never overwrites provider authority.", evidence: [internal/application/usecases/contact-directory/contacts_test.go]}]
    capabilities: [resolve-recipient, inspect-profile]
    evidence: [internal/application/usecases/contact-directory/contacts_test.go]

  - id: insights-reporting
    subdomain: customer-knowledge
    status: candidate
    decision_status: hypothesis
    confidence: medium
    model_kind: read-model
    classification: supporting
    owner: unassigned
    purpose: Build reporting projections from delivery facts and provider analytics.
    non_responsibilities: [Change delivery outcomes., Own provider analytics., Enforce delivery invariants.]
    language:
      - {term: delivery-fact, definition: "Proposed immutable fact from Messaging Delivery; publication is not implemented.", forbidden_aliases: [firestore-row], code_symbols: []}
      - {term: metric-snapshot, definition: "Derived metric for a defined reporting period.", forbidden_aliases: [api-response], code_symbols: []}
    owns: [reporting-projection]
    data_ownership:
      - {resource: delivery-facts, authority: local-authoritative, owner: messaging-delivery, write_policy: "Consumed without mutation.", evidence: [internal/application/usecases/messaging-delivery]}
      - {resource: reporting-projection, authority: derived-projection, owner: insights-reporting, write_policy: "Rebuilt from facts and analytics.", evidence: [internal/application/usecases/insights-reporting/reports.go]}
    invariants: [{id: INS-001, statement: "A metric snapshot identifies its period and source facts.", evidence: [internal/application/usecases/insights-reporting/reports_test.go]}]
    capabilities: [project-delivery-facts, query-metrics]
    evidence: [internal/application/usecases/insights-reporting/reports_test.go]

  - id: content-intelligence
    subdomain: content-intelligence-subdomain
    status: candidate
    decision_status: hypothesis
    confidence: low
    model_kind: process-model
    classification: supporting
    owner: unassigned
    purpose: Produce reviewable content drafts without binding consumers to an AI provider.
    non_responsibilities: [Publish content directly., Own delivery., Treat model output as approved content.]
    language:
      - {term: generation-request, definition: "Provider-independent request constrained by consumer policy.", forbidden_aliases: [openai-request, gemini-request], code_symbols: []}
      - {term: content-draft, definition: "Unapproved generated output returned to a consumer.", forbidden_aliases: [final-message], code_symbols: []}
    owns: [generation-policy, generation-audit]
    data_ownership:
      - {resource: generation-policy, authority: local-authoritative, owner: content-intelligence, write_policy: "Proposed consumer policy; no production generation workflow is implemented.", evidence: [docs/architecture/decisions/0003-tactical-models-without-strategic-promotion.md]}
      - {resource: model-output, authority: provider-authoritative, owner: ai-provider, write_policy: "Imported as an unapproved draft.", evidence: [internal/infrastructure/openai, internal/infrastructure/google/genai]}
    invariants: [{id: CNT-001, statement: "Generated output remains a draft until accepted by its consumer.", evidence: [docs/architecture/decisions/0003-tactical-models-without-strategic-promotion.md]}]
    capabilities: [generate-content-draft, record-generation-outcome]
    open_questions: [Validate whether product-owned prompt policy warrants a context.]
    evidence: [docs/architecture/decisions/0003-tactical-models-without-strategic-promotion.md]

