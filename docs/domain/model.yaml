  - {upstream: experience-presentation, downstream: messaging-delivery, pattern: published-language, contract: InteractionMessage, interaction: asynchronous, decision_status: hypothesis, confidence: low, consumer_owned_by: messaging-delivery}
  - {upstream: content-intelligence, downstream: experience-presentation, pattern: customer-supplier, contract: ContentDraft, interaction: synchronous, decision_status: hypothesis, confidence: low, consumer_owned_by: experience-presentation}
  - {upstream: content-intelligence, downstream: messaging-delivery, pattern: customer-supplier, contract: ContentDraft, interaction: synchronous, decision_status: hypothesis, confidence: low, consumer_owned_by: messaging-delivery}
  - {upstream: workspace-automation, downstream: messaging-delivery, pattern: published-language, contract: NotificationIntent, interaction: asynchronous, decision_status: hypothesis, confidence: low, consumer_owned_by: messaging-delivery}
