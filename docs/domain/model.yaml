    model_kind: process-model
    classification: supporting
    owner: unassigned
    package: internal/application/usecases/experience-presentation
    purpose: Read and manage LINE rich menus and assignments without a local publication lifecycle.
    non_responsibilities: [Own provider state., Persist speculative business lifecycles.]
    language:
      - {term: provider-presentation, definition: "Observed provider resource accessed through an application contract.", forbidden_aliases: [], code_symbols: []}
    owns: [provider-operation-orchestration]
    data_ownership:
      - {resource: provider-presentation, authority: provider-authoritative, owner: line-provider, write_policy: "Only explicit provider operations mutate the resource.", evidence: [internal/application/usecases/experience-presentation/provider.go]}
    invariants: []
    capabilities: [inspect-presentation, manage-provider-presentation]
    adrs: [docs/architecture/decisions/0007-remove-speculative-operator-models.md]
