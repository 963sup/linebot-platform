schema_version: 2

subdomains:
  - {id: reliable-customer-communication, classification: core, decision_status: hypothesis, confidence: medium, purpose: "Make customer communication reliable despite duplicate input and uncertain provider outcomes.", evidence: [internal/application/usecases/messaging-delivery/service.go]}
  - {id: tenant-channel-administration, classification: supporting, decision_status: hypothesis, confidence: medium, purpose: "Keep each LINE channel connection inside one tenant data and authorization boundary.", evidence: [internal/domain/tenant-administration/aggregates/channel_connection.go]}
  - {id: customer-segmentation, classification: supporting, decision_status: hypothesis, confidence: medium, purpose: "Define recipients independently from provider audience resources.", evidence: [internal/application/usecases/audience/provider.go]}
  - {id: customer-experience, classification: supporting, decision_status: hypothesis, confidence: low, purpose: "Coordinate presentation promotion and membership without merging their lifecycles.", evidence: [internal/application/usecases/experience-presentation, internal/application/usecases/promotion, internal/application/usecases/membership]}
  - {id: customer-knowledge, classification: supporting, decision_status: hypothesis, confidence: medium, purpose: "Provide recipient references and derived insight without owning provider profiles or delivery decisions.", evidence: [internal/application/usecases/contact-directory, internal/application/usecases/insights-reporting]}
  - {id: content-intelligence-subdomain, classification: supporting, decision_status: hypothesis, confidence: low, purpose: "Produce reviewable content drafts through replaceable AI providers.", evidence: [internal/infrastructure/openai, internal/infrastructure/google/genai]}
  - {id: platform-commodities, classification: generic, decision_status: validated, confidence: high, purpose: "Supply replaceable persistence scheduling secrets storage transport identifiers and governance tooling without creating business Contexts.", evidence: [docs/domain/dependency-capabilities.yaml]}

contexts:
  - id: tenant-administration
    subdomain: tenant-channel-administration
    status: candidate
    decision_status: hypothesis
    confidence: medium
    model_kind: domain-model
    classification: supporting
    owner: linebot-platform
    purpose: Own the tenant boundary and the provider channel connections authorized to operate inside it.
    non_responsibilities: [Authenticate people., Verify LINE webhook signatures., Store provider credentials., Own conversations or message delivery.]
    package: internal/domain/tenant-administration
    language:
      - {term: tenant, definition: "Isolation boundary for customer data channel connections and authorization.", forbidden_aliases: [line-channel], code_symbols: [internal/domain/tenant-administration/value-objects.TenantID]}
      - {term: channel-connection, definition: "Tenant-owned association to one external provider channel identity.", forbidden_aliases: [bot-config], code_symbols: [internal/domain/tenant-administration/aggregates.ChannelConnection]}
    owns: [tenant-id, channel-connection, messaging-destination-binding]
    aggregates:
      - {name: ChannelConnection, root: channel-connection, consistency_boundary: "A messaging destination belongs to one tenant channel connection.", owns: [messaging-destination-binding], repository: internal/domain/tenant-administration/repositories.ChannelConnectionRepository, confidence: medium, evidence: [internal/domain/tenant-administration/aggregates/channel_connection.go, internal/domain/tenant-administration/aggregates/channel_connection_test.go]}
    data_ownership:
      - {resource: channel-connection-state, authority: local-authoritative, owner: tenant-administration, write_policy: "Only Tenant Administration may register a destination binding.", evidence: [internal/adapter/outbound/google/cloud/firestore/channel_connection_repository.go]}
      - {resource: provider-channel-secret, authority: provider-authoritative, owner: line-provider, write_policy: "Credentials stay outside the Domain and are resolved at the adapter boundary.", evidence: [internal/bootstrap/durable.go]}
    invariants:
      - {id: TEN-001, statement: "One valid LINE messaging destination resolves to one tenant channel connection.", evidence: [internal/domain/tenant-administration/aggregates/channel_connection_test.go]}
    capabilities: [resolve-channel-scope]
    open_questions: [Define tenant membership and the controlled channel-connection registration workflow.]
    adrs: [docs/architecture/decisions/0006-tenant-channel-conversation-skeleton.md]
    evidence: [internal/application/usecases/channel-connection/resolver.go, internal/adapter/inbound/http/line/event_acl.go]

  - id: messaging-delivery
    subdomain: reliable-customer-communication
    status: candidate
    decision_status: hypothesis
    confidence: medium
    model_kind: domain-model
    classification: core
    owner: linebot-platform
    package: internal/domain/messaging-delivery
    purpose: Decide and record one reliable delivery outcome for an accepted communication intent.
    non_responsibilities: [Define provider wire formats., Own audience membership., Treat a missing provider response as a known failure.]
    language:
      - {term: delivery-intent, definition: "Request to deliver content to a resolved recipient.", forbidden_aliases: [line-request], code_symbols: []}
      - {term: delivery, definition: "Consistency boundary for claim and terminal outcome.", forbidden_aliases: [cloud-task], code_symbols: [internal/domain/messaging-delivery/aggregates.Delivery]}
      - {term: unknown-outcome, definition: "Send whose remote effect cannot be safely determined.", forbidden_aliases: [failed], code_symbols: [internal/domain/messaging-delivery/value-objects.StatusUnknown]}
      - {term: idempotency-key, definition: "Stable identity preventing duplicate business delivery.", forbidden_aliases: [task-name], code_symbols: []}
    owns: [delivery-intent, delivery-claim, delivery-outcome]
    aggregates:
      - {name: Delivery, root: delivery, consistency_boundary: "Claim is single-use and completion accepts one terminal outcome.", owns: [delivery-claim, delivery-outcome, idempotency-key], confidence: medium, evidence: [internal/domain/messaging-delivery/aggregates/delivery.go, internal/domain/messaging-delivery/aggregates/delivery_test.go]}
    data_ownership:
      - {resource: delivery-state, authority: local-authoritative, owner: messaging-delivery, write_policy: "Only the delivery workflow may claim or complete it.", evidence: [internal/adapter/outbound/google/cloud/firestore/event_store.go]}
      - {resource: provider-message-result, authority: provider-authoritative, owner: line-provider, write_policy: "Imported through the messaging ACL.", evidence: [internal/adapter/outbound/line]}
    invariants:
      - {id: MSG-001, statement: "A delivery can be claimed for network send only once within its active lease.", evidence: [internal/adapter/outbound/google/cloud/firestore/event_store.go]}
      - {id: MSG-002, statement: "Transport ambiguity becomes unknown-outcome rather than known failure.", evidence: [internal/application/usecases/messaging-delivery/service.go]}
    capabilities: [accept-delivery-intent, claim-delivery, complete-delivery, reconcile-pending-delivery]
    open_questions: [Confirm delivery reliability as the primary product differentiator.]
    evidence: [internal/application/usecases/messaging-delivery/ports.go, internal/application/usecases/messaging-delivery/service.go, internal/application/usecases/messaging-delivery/service_test.go]

  - id: audience
