    status: candidate
    decision_status: hypothesis
    confidence: low
    model_kind: process-model
    classification: supporting
    owner: unassigned
    package: internal/application/usecases/audience
    purpose: Read and manage LINE provider audiences without a local definition lifecycle.
    non_responsibilities: [Own provider state., Persist speculative business lifecycles.]
    language:
      - {term: provider-audience, definition: "Observed provider resource accessed through an application contract.", forbidden_aliases: [], code_symbols: []}
    owns: [provider-operation-orchestration]
    data_ownership:
      - {resource: provider-audience, authority: provider-authoritative, owner: line-provider, write_policy: "Only explicit provider operations mutate the resource.", evidence: [internal/application/usecases/audience/provider.go]}
    invariants: []
    capabilities: [inspect-audience, manage-provider-audience]
    adrs: [docs/architecture/decisions/0007-remove-speculative-operator-models.md]
    evidence: [internal/application/usecases/audience/provider_test.go]

