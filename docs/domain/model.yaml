  - id: promotion
    subdomain: customer-experience
    status: candidate
    decision_status: hypothesis
    confidence: low
    model_kind: process-model
    classification: supporting
    owner: unassigned
    package: internal/application/usecases/promotion
    purpose: Read and manage provider coupons without a local campaign or eligibility lifecycle.
    non_responsibilities: [Own provider state., Persist speculative business lifecycles.]
    language:
      - {term: provider-coupon, definition: "Observed provider resource accessed through an application contract.", forbidden_aliases: [], code_symbols: []}
    owns: [provider-operation-orchestration]
    data_ownership:
