# Codex SDK routing catalog, not a version lockfile or complete API inventory.
# The only module-version authority is go.mod.
# declared = dependency only; client_ready = native factory, no business wiring;
# integrated = native Factory plus outbound Adapter source (not staging/prod approval).
schema_version = 1

[[modules]]
module = "github.com/line/line-bot-sdk-go/v8"
provider = "line"
kind = "service"
status = "integrated"
imports = ["github.com/line/line-bot-sdk-go/v8/linebot/messaging_api", "github.com/line/line-bot-sdk-go/v8/linebot/webhook"]
capabilities = ["line-webhook", "line-reply", "line-push", "line-profile", "line-flex", "line-managed-http", "line-context-isolation"]
factory = "internal/infrastructure/line"
adapter = "internal/adapter/outbound/line"
reference = "https://github.com/line/line-bot-sdk-go"

[[modules]]
module = "github.com/google/uuid"
provider = "google-uuid"
kind = "utility"
status = "integrated"
imports = ["github.com/google/uuid"]
capabilities = ["uuid-v4", "line-retry-key"]
reference = "https://pkg.go.dev/github.com/google/uuid"

[[modules]]
module = "github.com/BurntSushi/toml"
provider = "toml"
kind = "tooling"
status = "integrated"
imports = ["github.com/BurntSushi/toml"]
capabilities = ["codex-config-validation", "toml-parse"]
reference = "https://github.com/BurntSushi/toml"

[[modules]]
module = "go.yaml.in/yaml/v3"
provider = "yaml"
kind = "tooling"
status = "integrated"
imports = ["go.yaml.in/yaml/v3"]
capabilities = ["strict-yaml-manifest-validation", "domain-model-governance"]
reference = "https://pkg.go.dev/go.yaml.in/yaml/v3"

[[modules]]
module = "cloud.google.com/go/firestore"
provider = "google-cloud"
kind = "service"
status = "integrated"
imports = ["cloud.google.com/go/firestore"]
capabilities = ["firestore-documents", "firestore-transactions", "durable-inbox-outbox", "single-use-claim", "reconcile"]
factory = "internal/infrastructure/google/cloud/firestore"
adapter = "internal/adapter/outbound/google/cloud/firestore"
reference = "https://cloud.google.com/go/docs/reference/cloud.google.com/go/firestore/latest"

[[modules]]
module = "cloud.google.com/go/cloudtasks"
provider = "google-cloud"
kind = "service"
status = "integrated"
