#:schema https://developers.openai.com/codex/config-schema.json
# V3 project configuration. Registration is not runtime proof of connectivity.
project_doc_max_bytes = 65536

[features]
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 9
max_depth = 1

[agents.architect]
description = "Designs Go DDD and Hexagonal boundaries, ports and architecture decisions"
config_file = "agents/architect.toml"
[agents.architecture_auditor]
description = "Read-only full Go audit of architecture, semantics, abstractions, types, interfaces, functions, naming, and assets"
config_file = "agents/architecture_auditor.toml"
[agents.researcher]
description = "Verifies current Go, SDK, CLI, Google, OpenAI and Codex documentation"
config_file = "agents/researcher.toml"
[agents.domain]
description = "Defines domain entities, aggregates, value objects and invariants"
config_file = "agents/domain.toml"
[agents.application]
description = "Implements use cases, commands, queries and consumer-owned ports"
config_file = "agents/application.toml"
[agents.integration]
description = "Implements external API, persistence, messaging and SDK adapters"
config_file = "agents/integration.toml"
[agents.platform]
description = "Plans Cloud Run, IAM, configuration, observability and release infrastructure"
config_file = "agents/platform.toml"
[agents.environment]
description = "Prepares and verifies local and Codex Cloud tools, MCPs and approved skills"
config_file = "agents/environment.toml"
[agents.reviewer]
description = "Independently validates Go correctness, architecture, security, performance and tests"
config_file = "agents/reviewer.toml"

[mcp_servers.gopls]
command = "bash"
args = ["-lc", "exec env XDG_CACHE_HOME=/workspace/.cache MISE_DATA_DIR=/workspace/.linebot-tools/mise MISE_CACHE_DIR=/workspace/.cache/mise MISE_CONFIG_DIR=/workspace/.config/mise MISE_STATE_DIR=/workspace/.local/state/mise /workspace/.linebot-tools/mise/shims/gopls mcp"]
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 60
[mcp_servers.repomix]
command = "/workspace/.linebot-tools/mcp-runtime/node_modules/.bin/repomix"
args = ["--mcp", "--sandbox", "/workspace/linebot-platform"]
enabled_tools = ["pack_codebase", "read_repomix_output", "grep_repomix_output", "file_system_read_file", "file_system_read_directory"]
enabled = true
required = false
startup_timeout_sec = 45
tool_timeout_sec = 120
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_MCP_TOKEN"
default_tools_approval_mode = "writes"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45
[mcp_servers.google_developer_knowledge]
url = "https://developerknowledge.googleapis.com/mcp"
env_http_headers = { "X-Goog-Api-Key" = "DEVELOPERKNOWLEDGE_API_KEY" }
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

# Policy-only declaration: enabled does not prove credentials or permission;
# every command remains approval-gated by prompt and external authorization.
[mcp_servers.google_cloud_cli]
url = "https://cloudcli.googleapis.com/mcp"
enabled_tools = ["run_gcloud_command"]
default_tools_approval_mode = "prompt"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

# HashiCorp's official server is restricted to public Registry documentation.
[mcp_servers.terraform]
command = "docker"
args = ["run", "-i", "--rm", "hashicorp/terraform-mcp-server@sha256:11dd418bba6003dd5777e9d0979b68de59929a155b355f338f407947e00e9d80", "stdio", "--toolsets=registry"]
enabled_tools = ["search_provider_docs", "get_provider_details", "get_latest_provider_version", "get_provider_capabilities", "search_modules", "get_module_details", "get_latest_module_version", "search_policies", "get_policy_details"]
default_tools_approval_mode = "prompt"
enabled = true
required = false
startup_timeout_sec = 45
tool_timeout_sec = 60

# Official LINE MCP for controlled account inspection.
# Mutating tools (push, broadcast, rich-menu changes) remain excluded.
# CHANNEL_ACCESS_TOKEN must be supplied via the Codex runtime environment.
# Keep openapi_line separately for read-only API schema discovery.
[mcp_servers.line]
command = "/workspace/.linebot-tools/mcp-runtime/node_modules/.bin/line-bot-mcp-server"
args = []
env_vars = ["CHANNEL_ACCESS_TOKEN"]
enabled_tools = ["get_profile", "get_message_quota", "get_rich_menu_list", "get_follower_ids", "get_group_summary"]
default_tools_approval_mode = "prompt"
enabled = true
required = false
startup_timeout_sec = 45
tool_timeout_sec = 60

# LINE's pinned OpenAPI description is exposed for discovery and schema reads;
# invoke-api-endpoint is intentionally absent from enabled_tools.
[mcp_servers.openapi_line]
command = "/workspace/.linebot-tools/mcp-runtime/node_modules/.bin/openapi-mcp-server"
args = ["--api-base-url", "https://api.line.me", "--openapi-spec", "/workspace/.linebot-tools/openapi/line-messaging-api.yml", "--tools", "dynamic", "--verbose", "false"]
enabled_tools = ["list-api-endpoints", "get-api-endpoint-schema"]
default_tools_approval_mode = "prompt"
enabled = true
required = false
startup_timeout_sec = 45
tool_timeout_sec = 60

# Staging-only Firestore tools remain disabled by default.
[mcp_servers.firestore_toolbox]
command = "/workspace/.linebot-tools/mcp-runtime/node_modules/.bin/toolbox"
args = ["--prebuilt=firestore", "--stdio"]
env_vars = ["FIRESTORE_PROJECT", "GOOGLE_APPLICATION_CREDENTIALS"]
enabled_tools = ["get_documents", "query_collection", "list_collections", "get_rules", "validate_rules"]
default_tools_approval_mode = "prompt"
enabled = false
required = false
startup_timeout_sec = 45
tool_timeout_sec = 45
