#:schema https://developers.openai.com/codex/config-schema.json
# V3 project configuration. Registration is not runtime proof of connectivity.
project_doc_max_bytes = 65536

[features]
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 9
max_depth = 1

[agents.architect]
description = "Designs Go DDD and Hexagonal boundaries, ports and architecture decisions"
config_file = "agents/architect.toml"
[agents.architecture_auditor]
description = "Read-only full Go audit of architecture, semantics, abstractions, types, interfaces, functions, naming, and assets"
config_file = "agents/architecture_auditor.toml"
[agents.researcher]
description = "Verifies current Go, SDK, CLI, Google, OpenAI and Codex documentation"
config_file = "agents/researcher.toml"
[agents.domain]
description = "Defines domain entities, aggregates, value objects and invariants"
config_file = "agents/domain.toml"
[agents.application]
description = "Implements use cases, commands, queries and consumer-owned ports"
config_file = "agents/application.toml"
[agents.integration]
description = "Implements external API, persistence, messaging and SDK adapters"
config_file = "agents/integration.toml"
[agents.platform]
description = "Plans Cloud Run, IAM, configuration, observability and release infrastructure"
config_file = "agents/platform.toml"
[agents.environment]
description = "Prepares and verifies local and Codex Cloud tools, MCPs and approved skills"
config_file = "agents/environment.toml"
[agents.reviewer]
description = "Independently validates Go correctness, architecture, security, performance and tests"
config_file = "agents/reviewer.toml"

[mcp_servers.gopls]
command = "bash"
args = ["/workspace/linebot-platform/bootstrap.sh", "exec", "--", "gopls", "mcp"]
enabled = true
required = false
startup_timeout_sec = 120
tool_timeout_sec = 60
[mcp_servers.repomix]
command = "bash"
args = ["/workspace/linebot-platform/bootstrap.sh", "exec", "--", "repomix", "--mcp", "--sandbox", "/workspace/linebot-platform"]
enabled_tools = ["pack_codebase", "read_repomix_output", "grep_repomix_output", "file_system_read_file", "file_system_read_directory"]
enabled = true
required = true
startup_timeout_sec = 45
tool_timeout_sec = 120
# Native skill generation is unavailable in Repomix sandbox mode.
# This separate write-capable server is NOT workspace-confined by Repomix.
# Inspect directory/scope/output before approval; only generation is exposed.
[mcp_servers.repomix_skills]
command = "bash"
args = ["/workspace/linebot-platform/bootstrap.sh", "exec", "--", "repomix", "--mcp"]
enabled_tools = ["generate_skill"]
default_tools_approval_mode = "prompt"
enabled = true
required = false
startup_timeout_sec = 45
tool_timeout_sec = 120

# Filesystem operations are limited to this repository; Roots cannot widen access.
# Filesystem MCP is not a substitute for the Codex sandbox or OS permissions.
[mcp_servers.filesystem]
command = "bash"
args = ["/workspace/linebot-platform/bootstrap.sh", "exec", "npm:@modelcontextprotocol/server-filesystem@2.2.0", "--", "mcp-server-filesystem", "--confine-roots", "/workspace/linebot-platform"]
default_tools_approval_mode = "writes"
enabled = true
required = false
startup_timeout_sec = 45
tool_timeout_sec = 60

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_MCP_TOKEN"
default_tools_approval_mode = "writes"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45
[mcp_servers.google_developer_knowledge]
url = "https://developerknowledge.googleapis.com/mcp"
env_http_headers = { "X-Goog-Api-Key" = "DEVELOPERKNOWLEDGE_API_KEY" }
enabled = false
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

# Cloud CLI remote MCP uses a short-lived OAuth access token supplied by the host.
# Approval is prompted for every tool call; actual access is constrained by Google IAM.
# Runtime must provide GOOGLE_CLOUD_ACCESS_TOKEN and GOOGLE_CLOUD_PROJECT.
[mcp_servers.google_cloud_cli]
url = "https://cloudcli.googleapis.com/mcp"
bearer_token_env_var = "GOOGLE_CLOUD_ACCESS_TOKEN"
env_http_headers = { "x-goog-user-project" = "GOOGLE_CLOUD_PROJECT" }
enabled_tools = ["run_gcloud_command"]
default_tools_approval_mode = "prompt"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

# HashiCorp's official server is restricted to public Registry documentation.
[mcp_servers.terraform]
command = "docker"
args = ["run", "-i", "--rm", "hashicorp/terraform-mcp-server@sha256:11dd418bba6003dd5777e9d0979b68de59929a155b355f338f407947e00e9d80", "stdio", "--toolsets=registry"]
enabled_tools = ["search_provider_docs", "get_provider_details", "get_latest_provider_version", "get_provider_capabilities", "search_modules", "get_module_details", "get_latest_module_version", "search_policies", "get_policy_details"]
default_tools_approval_mode = "prompt"
enabled = false
required = false
startup_timeout_sec = 45
tool_timeout_sec = 60

# Official LINE MCP for controlled account inspection.
# Mutating tools (push, broadcast, rich-menu changes) remain excluded.
# CHANNEL_ACCESS_TOKEN must be supplied via the Codex runtime environment.
# Keep openapi_line separately for read-only API schema discovery.
[mcp_servers.line]
command = "bash"
args = ["/workspace/linebot-platform/bootstrap.sh", "exec", "npm:@line/line-bot-mcp-server@0.5.0", "--", "line-bot-mcp-server"]
env_vars = ["CHANNEL_ACCESS_TOKEN"]
enabled_tools = ["get_profile", "get_message_quota", "get_rich_menu_list", "get_follower_ids", "get_group_summary"]
default_tools_approval_mode = "prompt"
enabled = false
required = false
startup_timeout_sec = 45
tool_timeout_sec = 60

# LINE's pinned OpenAPI description is exposed for discovery and schema reads;
# invoke-api-endpoint is intentionally absent from enabled_tools.
[mcp_servers.openapi_line]
command = "bash"
args = ["/workspace/linebot-platform/bootstrap.sh", "exec", "npm:@ivotoby/openapi-mcp-server@1.16.1", "--", "openapi-mcp-server", "--api-base-url", "https://api.line.me", "--openapi-spec", "/workspace/.linebot-tools/openapi/line-messaging-api.yml", "--tools", "dynamic", "--verbose", "false"]
enabled_tools = ["list-api-endpoints", "get-api-endpoint-schema"]
default_tools_approval_mode = "prompt"
enabled = false
required = false
startup_timeout_sec = 45
tool_timeout_sec = 60

# Staging-only Firestore tools remain disabled by default.
[mcp_servers.firestore_toolbox]
command = "bash"
args = ["/workspace/linebot-platform/bootstrap.sh", "exec", "npm:@toolbox-sdk/server@1.14.0", "--", "toolbox", "--prebuilt=firestore", "--stdio"]
env_vars = ["FIRESTORE_PROJECT", "GOOGLE_APPLICATION_CREDENTIALS"]
enabled_tools = ["get_documents", "query_collection", "list_collections", "get_rules", "validate_rules"]
default_tools_approval_mode = "prompt"
enabled = false
required = false
startup_timeout_sec = 45
tool_timeout_sec = 45

# Browser MCPs use fresh headless profiles and the environment's Chromium/proxy.
# Package installation happens during setup; do not download browsers on startup.
[mcp_servers.chrome_devtools]
command = "bash"
args = ["/workspace/linebot-platform/bootstrap.sh", "exec", "--", "chrome-devtools-mcp", "--headless", "--isolated", "--executable-path=/usr/bin/chromium", "--proxy-server=http://proxy:8080", "--no-usage-statistics", "--no-performance-crux"]
default_tools_approval_mode = "writes"
enabled = true
required = false
startup_timeout_sec = 60
tool_timeout_sec = 120

[mcp_servers.playwright]
command = "bash"
args = ["/workspace/linebot-platform/bootstrap.sh", "exec", "--", "playwright-mcp", "--headless", "--isolated", "--executable-path=/usr/bin/chromium", "--proxy-server=http://proxy:8080", "--proxy-bypass=localhost,127.0.0.1,[::1]", "--sandbox"]
default_tools_approval_mode = "writes"
enabled = true
required = false
startup_timeout_sec = 60
tool_timeout_sec = 120
