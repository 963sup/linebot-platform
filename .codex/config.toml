#:schema https://developers.openai.com/codex/config-schema.json

# Project-local connection and availability configuration. Codex loads it only
# in a trusted repository. Agent roles belong in .codex/agents/*.toml; project
# routing and verification rules belong in AGENTS.md.
# Do not store access tokens, ADC keys, passwords, or host-specific paths here.
# No global model or approval setting: inherit the signed-in user's controls.

[features]
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3

[agents.cloud_platform]
description = "cloud platform specialist."
config_file = "agents/cloud_platform.toml"

[agents.cloud_run_release]
description = "cloud run release specialist."
config_file = "agents/cloud_run_release.toml"

[agents.code_cleanup_release_validation]
description = "code cleanup release validation specialist."
config_file = "agents/code_cleanup_release_validation.toml"

[agents.delivery_orchestrator]
description = "delivery orchestrator specialist."
config_file = "agents/delivery_orchestrator.toml"

[agents.docs_researcher]
description = "docs researcher specialist."
config_file = "agents/docs_researcher.toml"

[agents.domain_architect]
description = "domain architect specialist."
config_file = "agents/domain_architect.toml"

[agents.git_release]
description = "git release specialist."
config_file = "agents/git_release.toml"

[agents.github_actions_reviewer]
description = "github actions reviewer specialist."
config_file = "agents/github_actions_reviewer.toml"

[agents.go_agents_md_author]
description = "go agents md author specialist."
config_file = "agents/go_agents_md_author.toml"

[agents.go_architecture_reviewer]
description = "go architecture reviewer specialist."
config_file = "agents/go_architecture_reviewer.toml"

[agents.go_feature_engineer]
description = "go feature engineer specialist."
config_file = "agents/go_feature_engineer.toml"

[agents.go_reviewer]
description = "go reviewer specialist."
config_file = "agents/go_reviewer.toml"

[agents.google_identity_workspace_integrator]
description = "google identity workspace integrator specialist."
config_file = "agents/google_identity_workspace_integrator.toml"

[agents.gopls_go_refactor]
description = "gopls go refactor specialist."
config_file = "agents/gopls_go_refactor.toml"

[agents.line_integrator]
description = "line integrator specialist."
config_file = "agents/line_integrator.toml"

[agents.openai_docs_researcher]
description = "openai docs researcher specialist."
config_file = "agents/openai_docs_researcher.toml"

[agents.technical_docs_writer]
description = "technical docs writer specialist."
config_file = "agents/technical_docs_writer.toml"

# Go-language intelligence: "gopls mcp" detached stdio mode.
# Cloud setup installs the pinned gopls binary into $HOME/.local/bin.
[mcp_servers.gopls]
command = "gopls"
args = ["mcp"]
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 60

# Current SDK documentation. Anonymous HTTP access may be rate-limited.
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

# GitHub official remote MCP. The token is supplied only through the environment.
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_MCP_TOKEN"
default_tools_approval_mode = "writes"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

# Google MCP Toolbox for Databases (Firestore prebuilt).
# Requires FIRESTORE_PROJECT, FIRESTORE_DATABASE, and GOOGLE_APPLICATION_CREDENTIALS
# in the runtime environment.
[mcp_servers.firestore_toolbox]
command = "npx"
args = ["-y", "@toolbox-sdk/server@1.14.0", "--prebuilt=firestore", "--stdio"]
env_vars = ["FIRESTORE_PROJECT", "FIRESTORE_DATABASE", "GOOGLE_APPLICATION_CREDENTIALS"]
enabled_tools = ["get_documents", "query_collection", "list_collections", "get_rules", "validate_rules"]
default_tools_approval_mode = "prompt"
enabled = false
required = false
startup_timeout_sec = 45
tool_timeout_sec = 45

# Google-managed remote MCP servers. They remain optional at runtime and
# require a Google OAuth identity with least-privilege IAM.
[mcp_servers.google_cloud_run]
default_tools_approval_mode = "prompt"
url = "https://run.googleapis.com/mcp"
enabled = false
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

[mcp_servers.google_firestore]
default_tools_approval_mode = "prompt"
url = "https://firestore.googleapis.com/mcp"
enabled = false
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

# Official OpenAI Developer Documentation MCP (read-only).
# Agent-phase network access to developers.openai.com is required.
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

