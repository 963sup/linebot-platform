#:schema https://developers.openai.com/codex/config-schema.json

# Project-local connection and availability configuration. Codex loads it only
# in a trusted repository. Agent roles belong in .codex/agents/*.toml; project
# routing and verification rules belong in AGENTS.md.
# Do not store access tokens, ADC keys, passwords, or host-specific paths here.
# No global model, sandbox, or CLI approval override: inherit the user's controls.
# External write operations still require explicit user authorization.

# Load the entire repository-level AGENTS.md on projects with long guidance.
project_doc_max_bytes = 65536

[features]
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3

# Custom specialist role registrations. Paths are relative to .codex/.
# Roles are delegated on demand; defining a role does not run or elevate it.
[agents.api_contract_reviewer]
description = "HTTP, webhook and external integration contract compatibility reviewer"
config_file = "agents/api_contract_reviewer.toml"

[agents.architecture_alignment_engineer]
description = "Evidence-driven repository realignment to DESIGN.md and DIRECTORY-STRUCTURE.md"
config_file = "agents/architecture_alignment_engineer.toml"

[agents.cloud_platform]
description = "Google Cloud IAM, networking, deployment infrastructure and runtime configuration specialist"
config_file = "agents/cloud_platform.toml"

[agents.cloud_run_release]
description = "Cloud Run release planning, deployment safety and post-release verification specialist"
config_file = "agents/cloud_run_release.toml"

[agents.cloud_tasks_integrator]
