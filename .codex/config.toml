#:schema https://developers.openai.com/codex/config-schema.json

# Project-local connection and availability configuration. Codex loads it only
# in a trusted repository. Agent roles belong in .codex/agents/*.toml; project
# routing and verification rules belong in AGENTS.md.
# Do not store access tokens, ADC keys, passwords, or host-specific paths here.
# No global model or approval setting: inherit the signed-in user's controls.

[features]
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3

# Go-language intelligence: "gopls mcp" detached stdio mode.
# Cloud setup installs v0.24.0 into $HOME/.local/bin.
[mcp_servers.gopls]
command = "bash"
args = ["-c", 'exec "$HOME/.local/bin/gopls" mcp']
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 60

# Current SDK documentation. Anonymous HTTP access may be rate-limited.
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

# GitHub official remote MCP. The token is supplied only through the environment.
# Write operations remain gated by explicit user authorization and the git_release agent.
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_MCP_TOKEN"
http_headers = { "X-MCP-Toolsets" = "repos,issues,pull_requests" }
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

# Google MCP Toolbox for Databases (Firestore prebuilt).
# Intentionally disabled: connecting live data needs isolated staging ADC/IAM.
# The toolbox exposes write tools upstream; Codex only discovers read tools here.
[mcp_servers.firestore_toolbox]
command = "npx"
args = ["-y", "@toolbox-sdk/server@1.14.0", "--prebuilt=firestore", "--stdio"]
env_vars = ["FIRESTORE_PROJECT", "FIRESTORE_DATABASE", "GOOGLE_APPLICATION_CREDENTIALS"]
enabled_tools = ["get_documents", "query_collection", "list_collections", "get_rules", "validate_rules"]
default_tools_approval_mode = "prompt"
enabled = false
required = false
startup_timeout_sec = 45
tool_timeout_sec = 45

# Google-managed remote MCP servers. They remain disabled until Codex Cloud
# has a Google OAuth identity with staging-only, least-privilege IAM.
[mcp_servers.google_cloud_run]
url = "https://run.googleapis.com/mcp"
enabled = false
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

[mcp_servers.google_firestore]
url = "https://firestore.googleapis.com/mcp"
enabled = false
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

# Official OpenAI Developer Documentation MCP (read-only).
# Agent-phase network access to developers.openai.com is required.
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

# Google-managed MCP. Documentation discovery; may require Google authentication.
[mcp_servers.google_developer_knowledge]
url = "https://developerknowledge.googleapis.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

# Google-managed MCP. Requires explicit Google authentication and least-privilege access.
[mcp_servers.google_cloud_cli]
url = "https://cloudcli.googleapis.com/mcp"
enabled = false
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

