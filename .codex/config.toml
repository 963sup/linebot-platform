# Go-language intelligence: install the pinned gopls version on PATH in each environment.
# Preflight with `gopls version` and `gopls mcp` before relying on this MCP.
[mcp_servers.gopls]
command = "gopls"
args = ["mcp"]
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 60

# Current SDK documentation. Anonymous HTTP access may be rate-limited.
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

# GitHub official remote MCP. The token is supplied only through the environment.
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_MCP_TOKEN"
default_tools_approval_mode = "writes"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

# Google MCP Toolbox for Databases (Firestore prebuilt).
# Keep disabled by default; do not enable alongside google_firestore without purpose.
# Requires FIRESTORE_PROJECT, FIRESTORE_DATABASE, and GOOGLE_APPLICATION_CREDENTIALS
# in the runtime environment.
[mcp_servers.firestore_toolbox]
command = "npx"
args = ["-y", "@toolbox-sdk/server@1.14.0", "--prebuilt=firestore", "--stdio"]
env_vars = ["FIRESTORE_PROJECT", "FIRESTORE_DATABASE", "GOOGLE_APPLICATION_CREDENTIALS"]
enabled_tools = ["get_documents", "query_collection", "list_collections", "get_rules", "validate_rules"]
default_tools_approval_mode = "prompt"
enabled = false
required = false
startup_timeout_sec = 45
tool_timeout_sec = 45

# Google-managed remote MCP servers. Tools default to explicit approval when enabled.
# They remain optional at runtime and
# require a Google OAuth identity with least-privilege IAM.
[mcp_servers.google_cloud_run]
url = "https://run.googleapis.com/mcp"
default_tools_approval_mode = "prompt"
enabled = false
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

[mcp_servers.google_firestore]
url = "https://firestore.googleapis.com/mcp"
default_tools_approval_mode = "prompt"
enabled = false
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

