#:schema https://developers.openai.com/codex/config-schema.json
# Trusted project-local configuration. Connection declarations are not runtime proof.
# Inherit the user's global model, sandbox, provider and approval controls.
# Do not store tokens, API keys, passwords or machine-specific absolute paths.
project_doc_max_bytes = 65536

[features]
multi_agent = true

[agents]
# Existing role models stay in their role files. New roles may inherit the host.
# Omit model_reasoning_effort; do not invent an "auto" value.
enabled = true
max_concurrent_threads_per_session = 5

[agents.api_contract_reviewer]
description = "HTTP, webhook and external integration contract compatibility reviewer"
config_file = "agents/api_contract_reviewer.toml"

[agents.architecture_alignment_engineer]
description = "Evidence-driven repository realignment to DESIGN.md and DIRECTORY-STRUCTURE.md"
config_file = "agents/architecture_alignment_engineer.toml"

[agents.cloud_platform]
description = "Google Cloud IAM, networking, deployment infrastructure and runtime configuration specialist"
config_file = "agents/cloud_platform.toml"

[agents.cloud_run_release]
description = "Cloud Run release planning, deployment safety and post-release verification specialist"
config_file = "agents/cloud_run_release.toml"

[agents.cloud_tasks_integrator]
description = "Cloud Tasks asynchronous execution, retry and idempotency specialist"
config_file = "agents/cloud_tasks_integrator.toml"

[agents.code_cleanup_release_validation]
description = "Code cleanup, release readiness and final verification specialist"
config_file = "agents/code_cleanup_release_validation.toml"

[agents.data_migration_engineer]
description = "Firestore and OAuth persistence migration specialist with rollback and compatibility gates"
config_file = "agents/data_migration_engineer.toml"

[agents.delivery_orchestrator]
description = "Coordinates cross-domain work, delegated ownership, handoffs and final validation"
config_file = "agents/delivery_orchestrator.toml"

[agents.docs_researcher]
description = "Researches and verifies official SDK, API and architecture documentation"
config_file = "agents/docs_researcher.toml"

[agents.domain_architect]
description = "Defines domain boundaries, invariants, aggregates and application ports"
config_file = "agents/domain_architect.toml"

[agents.firestore_integrator]
description = "Firestore persistence and consistency implementation specialist"
config_file = "agents/firestore_integrator.toml"

[agents.git_release]
description = "Handles explicitly authorized Git commits, pushes and release changes"
config_file = "agents/git_release.toml"

[agents.github_actions_reviewer]
description = "Reviews GitHub Actions permissions, workflows, CI security and consistency"
config_file = "agents/github_actions_reviewer.toml"

[agents.go_agents_md_author]
description = "Maintains concise AGENTS.md guidance and agent instruction alignment"
config_file = "agents/go_agents_md_author.toml"

[agents.go_architecture_reviewer]
description = "Reviews DDD and Hexagonal dependency boundaries across Go packages"
config_file = "agents/go_architecture_reviewer.toml"

[agents.go_code_refactor]
description = "Behavior-preserving Go code quality refactoring; local simplification without architecture or API changes"
config_file = "agents/go_code_refactor.toml"

[agents.go_feature_engineer]
description = "Implements small, testable Go features within the approved application architecture"
config_file = "agents/go_feature_engineer.toml"

[agents.go_reviewer]
description = "Independently reviews Go correctness, concurrency, errors and tests"
config_file = "agents/go_reviewer.toml"

[agents.go_test_engineer]
description = "Go test design and coverage specialist for behavioral, contract, integration, race and regression evidence"
config_file = "agents/go_test_engineer.toml"

[agents.google_identity_workspace_integrator]
description = "Integrates Google OAuth, identity, Calendar and Workspace SDK adapters"
config_file = "agents/google_identity_workspace_integrator.toml"

[agents.gopls_go_refactor]
description = "Performs symbol-aware Go refactoring using gopls and reference validation"
config_file = "agents/gopls_go_refactor.toml"

[agents.incident_responder]
description = "Read-only production incident triage and recovery planning specialist"
config_file = "agents/incident_responder.toml"

[agents.line_integrator]
description = "Integrates LINE Messaging API SDK, webhook handling and channel-specific behavior"
config_file = "agents/line_integrator.toml"

[agents.observability_engineer]
description = "Production observability and diagnostic instrumentation specialist"
config_file = "agents/observability_engineer.toml"

[agents.openai_docs_researcher]
description = "Verifies OpenAI APIs, Codex configuration and official SDK documentation"
config_file = "agents/openai_docs_researcher.toml"

[agents.performance_reviewer]
description = "Read-only Go concurrency, latency, throughput and cloud-cost performance reviewer"
config_file = "agents/performance_reviewer.toml"

[agents.security_reviewer]
description = "Independent security and privacy reviewer for LINE, OAuth, Google Cloud and webhook trust boundaries"
config_file = "agents/security_reviewer.toml"

[agents.technical_docs_writer]
description = "Updates technical documentation and implementation status based on verified code"
config_file = "agents/technical_docs_writer.toml"

# POSIX/WSL/Cloud: use the setup-installed binary, independent of shell PATH.
# Native Windows hosts require an explicitly validated local override.
[mcp_servers.gopls]
command = "bash"
args = ["-c", 'exec "$HOME/.local/bin/gopls" mcp']
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 60

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_MCP_TOKEN"
default_tools_approval_mode = "writes"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

# Optional staging-only database tools. Do not enable alongside google_firestore without purpose.
[mcp_servers.firestore_toolbox]
command = "npx"
args = ["-y", "@toolbox-sdk/server@1.14.0", "--prebuilt=firestore", "--stdio"]
env_vars = ["FIRESTORE_PROJECT", "FIRESTORE_DATABASE", "GOOGLE_APPLICATION_CREDENTIALS"]
enabled_tools = ["get_documents", "query_collection", "list_collections", "get_rules", "validate_rules"]
default_tools_approval_mode = "prompt"
enabled = false
required = false
startup_timeout_sec = 45
tool_timeout_sec = 45

# Disabled until explicit environment authorization and authentication.
[mcp_servers.google_cloud_run]
url = "https://run.googleapis.com/mcp"
default_tools_approval_mode = "prompt"
enabled = false
required = false
startup_timeout_sec = 20
tool_timeout_sec = 45

# Disabled until explicit environment authorization and authentication.
