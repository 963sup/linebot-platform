# Builds both production images after one shared verification pass.
substitutions:
  _REGION: 'asia-east1'
  _AR_REPOSITORY: 'line-bot'

serviceAccount: 'projects/bubbly-area-513305-s0/serviceAccounts/line-bot-build@bubbly-area-513305-s0.iam.gserviceaccount.com'

steps:
  - id: 'verify-go'
    name: 'golang@sha256:2920bb124f1a2e12a1d39f0cab756ae0068441ee1da7655dec7f5e374944095b'
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        go mod download
        go mod verify
        unformatted="$$(gofmt -l cmd/ internal/ tests/)"
        if [ -n "$$unformatted" ]; then
          printf 'Unformatted Go files:\n%s\n' "$$unformatted"
          exit 1
        fi
        go vet ./...
        go test -race -count=1 ./...
        mkdir -p /workspace/.release
        CGO_ENABLED=0 GOOS=linux go build -trimpath -o /workspace/.release/webhook ./cmd/webhook
        CGO_ENABLED=0 GOOS=linux go build -trimpath -o /workspace/.release/worker ./cmd/worker

  - id: 'build-public-image'
    name: 'gcr.io/cloud-builders/docker@sha256:fbc05705e6f24467e40ae8a4097ab9b8fae1116551f838fa2c55f4367427fc36'
    waitFor: ['verify-go']
    args: ['build', '--file', 'Dockerfile', '--build-arg', 'BINARY=webhook', '--tag', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/line-bot-public:$BUILD_ID', '.']

  - id: 'build-private-image'
    name: 'gcr.io/cloud-builders/docker@sha256:fbc05705e6f24467e40ae8a4097ab9b8fae1116551f838fa2c55f4367427fc36'
    waitFor: ['verify-go']
    args: ['build', '--file', 'Dockerfile', '--build-arg', 'BINARY=worker', '--tag', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/line-bot-private:$BUILD_ID', '.']

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/line-bot-public:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/line-bot-private:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1800s'
