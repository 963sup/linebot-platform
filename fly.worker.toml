# Staging-only Cloud Tasks target. HTTPS is externally reachable; authorization
# is enforced by the existing Google OIDC verifier on /tasks/* (NOT Cloud Run IAM).
# Replace app with your globally unique Fly app name.
app = "linebot-worker-staging"
primary_region = "sin" # Singapore; measure end-to-end latency from Taiwan before production
kill_signal = "SIGTERM"
kill_timeout = 20

[build]
  dockerfile = "Dockerfile.worker"

[env]
  APP_ENV = "staging"
  PORT = "8080"
  LINE_EVENT_MODE = "durable"
  LOG_LEVEL = "info"
  LOG_FORMAT = "json"
  GOOGLE_APPLICATION_CREDENTIALS = "/gcp-credentials.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"

# Base64-encoded secret file for staged ADC bootstrap only.
[[files]]
  guest_path = "/gcp-credentials.json"
  secret_name = "GCP_ADC_JSON_B64"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
